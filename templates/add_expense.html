{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="expense-section">
    <div class="expense-container">
        <div class="expense-header">
            <h1 class="expense-title">Add New Expense</h1>
            <p class="expense-subtitle">Keep your spending in check</p>
        </div>

        <div class="expense-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/expenses/add">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" step="0.01" id="amount" name="amount"
                           class="form-input" placeholder="0.00" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category"
                           class="form-input" placeholder="e.g. Food, Transport, Rent" required>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="What was this for?">
                </div>
                <button type="submit" class="btn-submit">Add Expense</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Back to Profile</a>
        </p>
    </div>
</section>
{% endblock %}
