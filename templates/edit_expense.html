{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<section class="expense-section">
    <div class="expense-container">
        <div class="expense-header">
            <h1 class="expense-title">Edit Expense</h1>
            <p class="expense-subtitle">Update your expense details</p>
        </div>

        <div class="expense-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/expenses/{{ expense.id }}/edit">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" step="0.01" id="amount" name="amount"
                           class="form-input" value="{{ expense.amount }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category"
                           class="form-input" value="{{ expense.category }}" required>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" value="{{ expense.date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description"
                           class="form-input" value="{{ expense.description or '' }}">
                </div>
                <button type="submit" class="btn-submit">Update Expense</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Back to Profile</a>
        </p>
    </div>
</section>
{% endblock %}
